const { Card, Badge, TwoToneHeading, FaqItem } = window.SearchableDesignSystem_29e52a;

  {name:"Google Cloud",logo:"uploads/google_cloud_logo_icon_170066.webp",status:"Delivery Partner",
   summary:"BigQuery-first warehouses with Looker for governed reporting and Vertex AI for models that move into production, not proofs of concept.",
   caps:["BigQuery Warehousing","Looker & Looker Studio","Vertex AI","Dataflow Pipelines","Regional Data Residency"],
   proof:["Certified Cloud Architects","Migration Playbooks","Cost Optimisation Reviews"]},
  {name:"Automation Anywhere",logo:"uploads/Automation_Anywhere_Logo.svg.png",status:"Implementation Partner",
   summary:"Intelligent automation across the back office: reconciliation, claims, onboarding and document-heavy processes wired straight into your data platform.",
   caps:["RPA Bot Development","Document Automation","Process Discovery","Bot Governance & Audit","Citizen Developer Enablement"],
   proof:["Accredited Bot Developers","Process Assessment Toolkit","Automation Centre Of Excellence"]},
  {name:"Infobip",logo:"uploads/infobip-logo.png",status:"Technology Partner",
   summary:"Customer engagement that closes the loop: WhatsApp, SMS and omnichannel journeys triggered by the same models and scores your analytics produce.",
   caps:["Omnichannel Messaging","WhatsApp Business API","Journey Orchestration","eVoucher Delivery","Engagement Analytics"],
   proof:["Integrated With eVoucher","Campaign Attribution","Regional Carrier Reach"]},
  {name:"Konza Technopolis",logo:"uploads/Konza-Technopolis-logo.png",status:"Innovation Partner",
   summary:"Our anchor for public-sector innovation and the national skills pipeline, local hosting, joint programmes and graduate talent entering our delivery squads.",
   caps:["National Data Centre Hosting","Public-Sector Programmes","Smart City Data Projects","Graduate Talent Pipeline","Joint Research & Labs"],
   proof:["Kenya-Based Hosting","Government Programme Delivery","Training Cohorts On Site"]}];

const STACK=[
  ["database","Platform","Azure, Microsoft Fabric and BigQuery, the warehouse and lakehouse layer your data lands in."],
  ["bot","Automation","Automation Anywhere bots take the manual steps out of reconciliation, claims and onboarding."],
  ["message-square","Engagement","Infobip carries the decision to the customer, on WhatsApp, SMS or in-app."],
  ["landmark","Local Anchor","Konza Technopolis provides Kenyan hosting, public-sector reach and the talent pipeline."]];

const BENEFITS=[
  ["file-signature","One Contract","Licences, implementation and support on a single Pathways agreement, no vendor triangle when something breaks."],
  ["badge-check","Certified People","Every platform above is delivered by engineers we certify and re-certify, not by generalists reading documentation."],
  ["route","No Lock-In Theatre","We deploy into your tenancy on your chosen cloud and hand over the infrastructure code at the end of each engagement."]];

function Plate({p,h=64}){
  return <div className="pt-plate" style={{height:h}}><img src={p.logo} alt={p.name+" logo"}/></div>;
}

function App(){
  const {PtButton,Frame,Section,Icon,PtFooter,TrustBar,ClientWall}=window;
  React.useEffect(()=>{if(window.lucide)lucide.createIcons();});
  return <>
    <Header/>
    <main id="main">
    <Frame bg="transparent" className="pt-hero">
      <div style={{padding:"92px 0 76px"}}>

      <div style={{marginTop:44,display:"grid",gap:24}}>
        {PARTNERS.map((p,i)=><Card key={p.name} hover padding={0}>
          <div className="pt-2col" style={{display:"grid",gridTemplateColumns:"290px minmax(0,1fr)",gap:0,alignItems:"stretch"}}>
            <div style={{padding:"30px",borderRight:"1px solid var(--grid-line)",display:"flex",flexDirection:"column",gap:18}}>
              <Plate p={p} h={78}/>
              <div>
                <Badge tone="accent">{p.status}</Badge>
                <h2 style={{fontSize:20,margin:"14px 0 0",fontWeight:"var(--weight-medium)"}}>{p.name}</h2></div>
              <div style={{display:"flex",flexDirection:"column",gap:9,marginTop:"auto"}}>
                {p.proof.map(x=><span key={x} style={{display:"flex",gap:9,alignItems:"center",fontSize:12.5,
                  color:"var(--text-secondary)"}}>
                  <span style={{color:"var(--secondary-text)",display:"inline-flex"}}><Icon name="check" size={14}/></span>{x}</span>)}</div>
            </div>
            <div style={{padding:"30px"}}>
              <div style={{fontSize:"var(--text-eyebrow)",letterSpacing:"var(--tracking-eyebrow)",textTransform:"uppercase",

              <p style={{fontSize:16,color:"var(--text-secondary)",lineHeight:1.7,marginTop:0,maxWidth:640}}>{p.summary}</p>
              <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:22}}>
                {p.caps.map(c=><span key={c} style={{display:"inline-flex",alignItems:"center",height:34,padding:"0 14px",
                  borderRadius:"var(--radius-pill)",border:"1px solid var(--border-hairline)",fontSize:13.5,
                  color:"var(--text-primary)",background:"var(--stone-50)"}}>{c}</span>)}</div>
              <a href="Contact Us.html" style={{display:"inline-flex",alignItems:"center",gap:8,fontSize:14,marginTop:24,

          <p style={{fontSize:"var(--text-sm)",color:"var(--text-secondary)",margin:0}}>{d}</p></Card>)}
      </div>

    </Section>

    <PtCtaBand imageId="cta-partnerships" title="Already Licensed On One Of These?"
      actions={<><PtButton tone="primary" size="md" arrow onClick={()=>{location.href="Contact Us.html"}}>Book A Demo</PtButton>

      and fill the gaps, no rip and replace.
    </PtCtaBand>

    <Section index="03" label="Clients" right="Programme Partners">
      <TwoToneHeading size="clamp(23px,4.6vw,32px)" maxWidth={820} lead="Delivered With Governments, Insurers And Global NGOs."
        rest="Programme partners and clients we build alongside, in the public sector, insurance and development."/>
      <ClientWall label={null}/>
    </Section>

    <Section index="04" label="Become A Partner" right="Work With Us">
      <div className="pt-2col" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:40,alignItems:"start"}}>
        <div>

            ["graduation-cap","Training","Run our Data Skills curriculum with licensed materials, instructor accreditation and 25% revenue share."]]

                <span style={{color:"var(--secondary-text)",display:"inline-flex",marginTop:2}}><Icon name={ic} size={20}/></span>
                <div><div style={{fontSize:17,fontWeight:"var(--weight-medium)",marginBottom:6}}>{t}</div>
                  <p style={{fontSize:"var(--text-sm)",color:"var(--text-secondary)",margin:0}}>{d}</p></div></div></Card>)}
        </div>
      </div>
    </Section>

    <Section index="05" label="Ask" right="Partner Questions" bg="var(--bg-subtle)">
      <div style={{maxWidth:760,margin:"0 auto"}}>
        {[["Can We Buy Microsoft Or Google Cloud Licences Through You?","Yes. We resell and manage licensing for the platforms we are certified on, so implementation, support and licences sit on one agreement."],
          ["Do You Only Deploy On Azure And Google Cloud?","Those are the two we are certified to deliver at depth. We will work in another cloud where you are already committed, and say so plainly if it limits us."],
          ["What Does The Automation Anywhere Partnership Cover?","Process discovery, bot development, document automation and bot governance, usually alongside a data platform so bots and reporting share one source of truth."],
          ["How Is Infobip Used In Your Products?","eVoucher issues and redeems through Infobip channels, and P-Score alerts can be delivered as WhatsApp or SMS journeys."],
          ["What Do You Do With Konza Technopolis?","Kenyan hosting for data-residency-bound workloads, joint public-sector programmes, and a graduate pipeline feeding our delivery squads and training cohorts."]]
          .map(([q,a],i)=><FaqItem key={q} question={q} defaultOpen={i===0}>{a}</FaqItem>)}
      </div>
    </Section>

    <PtFooter/>

}
